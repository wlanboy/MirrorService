spring:
  application:
    name: mirrorservice
  # Banner abschalten: spart eine Zeile Overhead beim Start und haelt die
  # Container-Logs (stdout) sauberer.
  main:
    banner-mode: "off"
  # Springs eigene JMX-MBean-Registrierung abschalten, da kein JMX-Monitoring
  # genutzt wird (spart etwas Startzeit/Speicher).
  jmx:
    enabled: false
  # Virtual Threads (Java 21+): Jetty bedient Requests auf Virtual Threads statt auf einem
  # festen Plattform-Thread-Pool. Blockierende Aufrufe (DNS-Lookups, isReachable, Delays)
  # belegen keinen OS-Thread mehr -> weniger Speicher pro Request, kein Pool-Tuning noetig.
  threads:
    virtual:
      enabled: true
  # FormContentFilter liest bei PUT/PATCH/DELETE Formular-Bodies vorab ein. /echo sähe dann
  # einen leeren Body. Der Dienst verarbeitet keine Formulare, der Filter wird nicht gebraucht.
  mvc:
    formcontent:
      filter:
        enabled: false
  lifecycle:
    # Zeitfenster, in dem laufende Requests beim Herunterfahren des Containers
    # noch abgeschlossen werden duerfen (passt zum graceful shutdown unten).
    timeout-per-shutdown-phase: 30s

server:
  port: ${PORT:8003}
  # Laufende Requests beim Shutdown noch abschliessen lassen, statt sie hart
  # zu kappen - wichtig fuer sauberes Signal-Handling in Kubernetes (PID 1).
  shutdown: graceful
  # Server laeuft hinter einem Reverse Proxy/Ingress: X-Forwarded-* Header
  # vom Framework auswerten lassen, damit Client-IP/Schema/Host in Logs und
  # gespiegelten Antworten korrekt ankommen.
  forward-headers-strategy: framework
  error:
    # Stacktraces/Exception-Messages nie an Clients durchreichen, um keine
    # internen Implementierungsdetails eines Mirror-/Proxy-Diensts preiszugeben.
    include-stacktrace: never
    include-message: never

mirror:
  # Set-Cookie aus responseHeaders weitergeben. Standardmaessig aus, weil Cookies mit
  # Domain-Attribut (z. B. Domain=.gmk.lan) sonst andere Anwendungen der Domain treffen.
  # Per Umgebungsvariable: MIRROR_ALLOW_SET_COOKIE=true
  allow-set-cookie: false

management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
