apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.deploymentName }}
spec:
  selector:
    app: {{ .Values.deploymentName }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
    # Actuator (Prometheus-Scrape per ServiceMonitor), nicht über Gateway/IngressRoute erreichbar
    - name: http-management
      port: {{ .Values.service.managementPort }}
      targetPort: management
