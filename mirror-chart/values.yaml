replicaCount: 1
deploymentName: mirror
namespace: mirror
image:
  repository: wlanboy/mirrorservice
  tag: latest
  pullPolicy: Always

hosts: 
  - mirror.tp.lan
  - mirror.gmk.lan
  - mirror.localhost

service:
  # Port des Kubernetes-Service (Ziel für VirtualService/IngressRoute)
  port: 8080
  # Port, auf dem die Anwendung im Container lauscht (server.port im Image)
  targetPort: 8003

# Ersetzt JAVA_TOOL_OPTIONS aus dem Image komplett, also immer den vollständigen Satz angeben.
# GC- und Header-Flags (SerialGC, CompactObjectHeaders) stehen im ENTRYPOINT und gehören nicht hierher.
# ActiveProcessorCount = resources.limits.cpu. -Xmx und limits.memory immer gemeinsam ändern.
javaOpts: >-
  -Xms64m -Xmx128m -Xss512k
  -XX:MaxMetaspaceSize=64m -XX:ReservedCodeCacheSize=48m
  -XX:TieredStopAtLevel=1 -XX:ActiveProcessorCount=1
  -XX:MaxDirectMemorySize=64m
  -XX:+ExitOnOutOfMemoryError -XX:-UsePerfData

# Docker-Messung (-Xmx192m, -m 256m, ~3100 req/s): memory.peak 189 MiB.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 320Mi

# UID 185 = User "default" aus dem UBI-Image. runAsGroup bewusst nicht gesetzt, damit
# die GID 0 aus dem Image bleibt. Für das jlink-Image (distroless nonroot) 65532 setzen.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 185
  fsGroup: 185
  seccompProfile:
    type: RuntimeDefault

# /tmp ist ein emptyDir, die Anwendung schreibt sonst nirgends hin.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

ingress:
  # istio | traefik | none
  controller: istio

istio:
  gateway: mirror-gateway
  gatewayNamespace: "istio-ingress"

traefik:
  entryPoints:
    - web
    - websecure

serviceEntry:
  enabled: false
  host: mirror.gmk.lan

certmanager:
  enabled: true
  issuer: local-ca-issuer
  kind: ClusterIssuer
  secretName: mirrorapi-tls

extraVolumeMounts: []
extraVolumes: []
extraEnv: []
